    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background */
      .bg-glow {
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        pointer-events: none;
        animation: float 8s ease-in-out infinite;
      }

      .bg-glow-1 {
        background: #3b82f6;
        top: -200px;
        left: -200px;
      }

      .bg-glow-2 {
        background: #8b5cf6;
        bottom: -200px;
        right: -200px;
        animation-delay: -4s;
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(30px, -30px); }
      }

      .container {
        text-align: center;
        z-index: 10;
        padding: 20px;
        max-width: 500px;
        width: 100%;
      }

      .logo-circle {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 30px;
        font-size: 48px;
        font-weight: 800;
        color: white;
        font-style: italic;
        box-shadow: 0 20px 60px rgba(59, 130, 246, 0.4);
        animation: pulse-glow 3s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 20px 60px rgba(59, 130, 246, 0.4); }
        50% { box-shadow: 0 20px 80px rgba(139, 92, 246, 0.6); }
      }

      h1 {
        font-size: 42px;
        font-weight: 800;
        color: white;
        margin-bottom: 12px;
        letter-spacing: 2px;
      }

      .subtitle {
        font-size: 16px;
        color: #94a3b8;
        margin-bottom: 50px;
        line-height: 1.6;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 18px 32px;
        border: none;
        border-radius: 16px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
      }

      .btn-user {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        color: white;
        box-shadow: 0 8px 30px rgba(59, 130, 246, 0.35);
      }

      .btn-user:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5);
      }

      .btn-admin {
        background: rgba(255, 255, 255, 0.05);
        color: #e2e8f0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .btn-admin:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .btn svg {
        width: 22px;
        height: 22px;
      }

      .footer {
        margin-top: 40px;
        color: #475569;
        font-size: 13px;
      }

      @media (max-width: 480px) {
        h1 { font-size: 32px; }
        .subtitle { font-size: 14px; margin-bottom: 40px; }
        .btn { padding: 16px 24px; font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
      <div class="logo-circle">S</div>
      <h1 style="font-size: 32px;">Welcome to the Showpay official platform</h1>
      <h2 class="subtitle" style="margin-bottom: 10px;">Download the Showpay app and Showpay apk</h2>
      <h2 class="subtitle" style="margin-bottom: 10px;">Fast and secure Showpay login</h2>
      <h3 class="subtitle">Contact Showpay customer support for Showpay help</h3>

      <div class="buttons">
        <a href="/login" class="btn btn-user" id="userLoginBtn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
          User Login
        </a>
        <a href="/admin" class="btn btn-admin" id="adminLoginBtn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" /></svg>
          Admin Panel
        </a>
      </div>

      <div class="footer">
        &copy; 2024 ShowPay. All rights reserved.
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Auto-redirect if already logged in
        const adminSession = localStorage.getItem("showpay_admin_session");
        if (adminSession) {
          window.location.href = "/admin-app/pages/dashboard.html";
          return;
        }
        
        const userSession = sessionStorage.getItem("showpay_session");
        if (userSession) {
          window.location.href = "/home";
        }
      });
    </script>
  </body>
</html>
