<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/admin-app/pages/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - ShowPay</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/png" href="/showpay-logo.png" />
    <link rel="apple-touch-icon" href="/showpay-logo.png" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="admin-login-wrapper">
      <div class="admin-login-box">
        <div style="text-align: center; margin-bottom: 24px;">
          <img src="/showpay-logo.png" alt="ShowPay" width="84" height="84" style="display: block; width: 84px; height: 84px; margin: 0 auto 12px; object-fit: cover; border-radius: 18px; background: #ffffff; box-shadow: 0 8px 25px rgba(23,27,86,0.2);" />
        </div>
        <div class="admin-title">Admin Portal</div>
        <form id="adminLoginForm">
          <input
            type="email"
            id="email"
            class="admin-input"
            placeholder="admin@showpay.com"
            required
          />
          <input
            type="password"
            id="password"
            class="admin-input"
            placeholder="Password"
            required
          />
          <div id="errorMsg" class="hidden" style="color: #ef4444; text-align: center; margin-bottom: 16px; font-size: 14px;"></div>
          <button type="submit" class="admin-btn">Login</button>
        </form>
      </div>
    </div>    <script type="module" src="../js/login.js"></script>
  </body>
</html>
