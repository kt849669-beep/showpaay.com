<html lang="en">
  <head>

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Primary Title & Description -->
    <title>ShowPay Login | ShowPay App &amp; Secure Account Access</title>
    <meta name="description" content="Access the ShowPay login at showpayy.com. Sign in to the Show Pay web app and find ShowPay APK, USDT, password and customer support help.">

    <!-- Crawling Instructions -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://showpayy.com/login" />

    <!-- Google Site Name & Open Graph (For Social & SERP Name) -->
    <meta property="og:site_name" content="ShowPay">
    <meta property="og:title" content="ShowPay Login | ShowPay App &amp; Secure Account Access">
    <meta property="og:description" content="Access the ShowPay login, use the mobile-friendly web app and find account, APK, password and USDT help.">
    <meta property="og:url" content="https://showpayy.com/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://showpayy.com/showpay-logo.png" />
    <meta property="og:image:alt" content="ShowPay logo" />

    <!-- Twitter Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ShowPay Login | ShowPay App &amp; Secure Account Access" />
    <meta name="twitter:description" content="Access the ShowPay login, use the mobile-friendly web app and find account, APK, password and USDT help." />
    <meta name="twitter:image" content="https://showpayy.com/showpay-logo.png" />

    <!-- Logo / Favicon -->
    <link rel="icon" type="image/png" href="/showpay-logo.png">
    <link rel="apple-touch-icon" href="/showpay-logo.png">

    <!-- Performance Optimizations -->
    <link rel="preload" href="../css/common.css" as="style" />
    <link rel="preload" href="../css/login.css" as="style" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="/showpay-seo.css" />
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.511.0/dist/umd/lucide.min.js"></script>
    
    <!-- Advanced SEO Schema Markup (JSON-LD for Google Auto-Discovery) -->
    <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://showpayy.com/#website","url":"https://showpayy.com/","name":"ShowPay","alternateName":["Showpay","Show pay"],"description":"ShowPay account login and mobile-friendly web application."},{"@type":"Organization","@id":"https://showpayy.com/#organization","name":"ShowPay","url":"https://showpayy.com/","logo":{"@type":"ImageObject","url":"https://showpayy.com/showpay-logo.png"},"sameAs":["https://t.me/bolinshowpay1"],"contactPoint":{"@type":"ContactPoint","contactType":"Customer Support","url":"https://showpayy.com/showpay-support.html"}},{"@type":"WebPage","@id":"https://showpayy.com/#webpage","url":"https://showpayy.com/","name":"ShowPay Login","description":"Sign in to ShowPay to access the account dashboard and available payment tools.","isPartOf":{"@id":"https://showpayy.com/#website"},"about":{"@id":"https://showpayy.com/#organization"},"mainEntity":{"@id":"https://showpayy.com/#webapp"}},{"@type":"WebApplication","@id":"https://showpayy.com/#webapp","name":"ShowPay","alternateName":["Showpay","Show pay"],"url":"https://showpayy.com/","applicationCategory":"FinanceApplication","operatingSystem":"Web","description":"ShowPay is a mobile-friendly web application for account access and the payment tools available to signed-in users."}]}</script>
  </head>
  <body>
    <main class="showpay-public-main">
    <div class="login-container">
      <div class="login-heading-brand">
      <img src="/showpay-brand.jpeg" alt="ShowPay" width="36" height="36" />
      <h1 class="header">Login</h1>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <i data-lucide="phone" class="input-icon"></i>
          <input
            type="tel"
            id="mobile"
            class="form-control"
            placeholder="Enter Your Phone Number"
            maxlength="10"
            required
          />
        </div>

        <div class="form-group">
          <i data-lucide="lock" class="input-icon"></i>
          <input
            type="text"
            id="password"
            class="form-control"
            placeholder="Enter Password"
            required
          />
        </div>

        <div class="forgot-password">
          <a href="https://app-web.showpayweb.com/forgetPassword">Forget Password?</a>
        </div>

        <div
          id="errorMessage"
          class="hidden"
          style="
            color: red;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
          "
        ></div>

        <div class="login-btn-container">
          <button type="submit" class="btn-primary" id="loginBtn">
            LOG IN
          </button>
        </div>

        <div class="register-link-container">
          <span>Don't have an account?</span> <a href="https://app-web.showpay-web.com/regist?code=2invite5p6">Register</a>
        </div>
      </form>
    </div>

    </main>

    <!-- Limit Popup -->
    <div
      id="limitPopup"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
      "
    ></div>

    <script type="module" src="../js/config/supabase.js"></script>
    <script type="module" src="../js/auth/login.js"></script>
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      window.addEventListener("pageshow", () => {
        if (!window.location.hash) {
          window.scrollTo(0, 0);
        }
      });

      lucide.createIcons();
    </script>
  </body>
</html>
