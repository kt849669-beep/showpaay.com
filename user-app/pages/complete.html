<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/user-app/pages/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>ShowPay Preview Complete</title>
    <link rel="icon" type="image/png" href="/showpay-logo.png" />
    <link rel="stylesheet" href="../css/common.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7fa;
      }

      .complete-card {
        width: min(100%, 380px);
        padding: 34px 24px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 14px 40px rgba(0, 123, 255, 0.12);
        text-align: center;
      }

      .complete-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #eaf4ff;
        color: #007bff;
        font-size: 32px;
        font-weight: 700;
      }

      h1 {
        margin-bottom: 10px;
        color: #172033;
        font-size: 24px;
      }

      p {
        margin-bottom: 24px;
        color: #667085;
        font-size: 14px;
        line-height: 1.6;
      }

      a {
        display: block;
        padding: 14px 18px;
        border-radius: 10px;
        background: #4da6ff;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="complete-card">
      <div class="complete-icon" aria-hidden="true">✓</div>
      <h1>Preview Completed</h1>
      <p>
        The ShowPay test workflow is complete. The mobile number, password and test PIN were not saved or sent anywhere.
      </p>
      <a href="/">Restart Preview</a>
    </main>
  </body>
</html>
